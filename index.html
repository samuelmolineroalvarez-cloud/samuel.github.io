<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phone Motion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📱 Phone Motion</h1>

        <p>
            Tilt your phone and move the ball.
        </p>

        <button id="startButton">
            Start Sensor
        </button>

        <p>
            Status:
            <strong id="statusText">Inactive</strong>
        </p>

        <div id="gameArea">
            <div id="ball"></div>
        </div>

        <div class="values">

            <div>
                <strong>Beta</strong>
                <span id="betaValue">0°</span>
            </div>

            <div>
                <strong>Gamma</strong>
                <span id="gammaValue">0°</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
