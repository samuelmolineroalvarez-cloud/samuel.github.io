```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motion Detector</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📱 Motion Detector</h1>

        <p class="description">
            This application uses your phone's motion sensor
            to detect movement.
        </p>

        <button id="startButton">
            Start Sensor
        </button>

        <div class="status">
            <span>Status:</span>
            <strong id="statusText">Inactive</strong>
        </div>

        <div class="sensor-container">

            <div class="sensor">
                <h2>X</h2>
                <p id="xValue">0.00</p>
                <span>m/s²</span>
            </div>

            <div class="sensor">
                <h2>Y</h2>
                <p id="yValue">0.00</p>
                <span>m/s²</span>
            </div>

            <div class="sensor">
                <h2>Z</h2>
                <p id="zValue">0.00</p>
                <span>m/s²</span>
            </div>

        </div>

        <div class="movement">

            <h2>Movement</h2>

            <div id="movementValue">
                0.00
            </div>

            <p id="movementStatus">
                Phone is still
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
